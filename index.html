<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Piazza</title>
  <meta name="description" content="IT Piazza courses, publications and certification preparation materials.">
  <link rel="canonical" href="https://itpiazza.net/">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f7fb;color:#20243a}
    main{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(720px,100%);background:white;border:1px solid #e4e6ef;border-radius:22px;padding:48px;box-shadow:0 18px 50px rgba(31,34,60,.08);text-align:center}
    h1{font-size:clamp(2.4rem,7vw,4.6rem);margin:0 0 14px}p{font-size:1.08rem;color:#687086;margin:0 auto 28px;max-width:560px}
    a{display:inline-block;background:#5b32e6;color:white;text-decoration:none;font-weight:700;padding:13px 20px;border-radius:11px}
    a:hover{background:#4825c5}
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>IT Piazza</h1>
      <p>The new static website is being migrated page by page. The Publications page is available now.</p>
      <a href="/publications/">View Publications</a>
    </section>
  </main>
</body>
</html>
